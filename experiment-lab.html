<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验页面 - Experiment Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .lab-header {
            background: #16213e;
            padding: 12px 20px;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lab-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lab-title span {
            font-size: 20px;
        }

        .lab-actions {
            display: flex;
            gap: 10px;
        }

        .lab-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .lab-btn.primary {
            background: #667eea;
            color: #fff;
        }

        .lab-btn.primary:hover {
            background: #5a6fd6;
        }

        .lab-btn.secondary {
            background: #2d2d44;
            color: #fff;
        }

        .lab-btn.secondary:hover {
            background: #3d3d5c;
        }

        .lab-btn.success {
            background: #28a745;
            color: #fff;
        }

        .lab-btn.success:hover {
            background: #218838;
        }

        .lab-main {
            display: flex;
            height: calc(100vh - 50px);
        }

        .lab-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d44;
        }

        .editor-header {
            background: #16213e;
            padding: 8px 16px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #2d2d44;
        }

        .code-editor {
            flex: 1;
            background: #0d1117;
            border: none;
            color: #c9d1d9;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 16px;
            resize: none;
            outline: none;
        }

        .code-editor::placeholder {
            color: #484f58;
        }

        .lab-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .preview-header {
            background: #f0f0f0;
            padding: 8px 16px;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #ddd;
        }

        .preview-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            background: #fff;
        }

        .preview-content h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .preview-content p {
            color: #666;
            margin-bottom: 10px;
        }

        .console-output {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #2d2d44;
        }

        .console-line {
            margin: 4px 0;
        }

        .console-line.error {
            color: #f85149;
        }

        .console-line.success {
            color: #3fb950;
        }

        .console-line.warn {
            color: #d29922;
        }

        .console-line.info {
            color: #58a6ff;
        }

        /* 示例代码模板 */
        .template-list {
            background: #16213e;
            padding: 8px 0;
            border-bottom: 1px solid #2d2d44;
        }

        .template-item {
            padding: 6px 16px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .template-item:hover {
            background: rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body>
    <div class="lab-header">
        <div class="lab-title">
            <span>🧪</span>
            实验页面
        </div>
        <div class="lab-actions">
            <button class="lab-btn secondary" onclick="loadTemplate('empty')">清空</button>
            <button class="lab-btn secondary" onclick="runCode()">▶ 运行代码</button>
            <button class="lab-btn success" onclick="copyToClipboard()">📋 复制代码</button>
            <button class="lab-btn primary" onclick="closeLab()">关闭</button>
        </div>
    </div>

    <div class="template-list">
        <div class="template-item" onclick="loadTemplate('alert')">💡 示例: 弹出提示</div>
        <div class="template-item" onclick="loadTemplate('chart')">📊 示例: 简单图表</div>
        <div class="template-item" onclick="loadTemplate('table')">📋 示例: 数据表格</div>
        <div class="template-item" onclick="loadTemplate('api')">🔌 示例: API 调用</div>
    </div>

    <div class="lab-main">
        <div class="lab-editor">
            <div class="editor-header">JavaScript 代码编辑区</div>
            <textarea id="codeEditor" class="code-editor" placeholder="在这里编写实验代码...
// 可以使用:
// - document 操作 DOM
// - console.log 输出到控制台
// - alert() 弹出提示
// - fetch() 调用 API"></textarea>
            <div id="consoleOutput" class="console-output"></div>
        </div>
        <div class="lab-preview">
            <div class="preview-header">预览效果</div>
            <div id="previewContent" class="preview-content">
                <h1>🧪 实验页面</h1>
                <p>在这里编写和测试代码，实验成功后可以将代码复制到正式视图使用。</p>
                <p><strong>使用方法：</strong></p>
                <p>1. 在左侧编辑器中编写 JavaScript 代码</p>
                <p>2. 点击"▶ 运行代码"查看效果</p>
                <p>3. 点击"📋 复制代码"复制到正式视图使用</p>
            </div>
        </div>
    </div>

    <script>
        const consoleOutput = document.getElementById('consoleOutput');
        const previewContent = document.getElementById('previewContent');
        const codeEditor = document.getElementById('codeEditor');

        // 示例模板
        const templates = {
            empty: '',
            alert: `// 示例: 弹出提示
const message = "Hello, Experiment Lab!";
alert(message);
console.log("Alert shown:", message);`,
            chart: `// 示例: 简单图表
const chartHTML = \`
<div style="padding: 20px;">
    <h3>📊 实验图表</h3>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="background: #667eea; color: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 24px;">85%</div>
            <div>完成率</div>
        </div>
        <div style="background: #28a745; color: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 24px;">12</div>
            <div>任务数</div>
        </div>
        <div style="background: #ffc107; color: #333; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 24px;">3</div>
            <div>进行中</div>
        </div>
    </div>
</div>
\`;
previewContent.innerHTML = chartHTML;
console.log("Chart rendered");`,
            table: `// 示例: 数据表格
const data = [
    { name: "任务1", status: "完成", owner: "张三" },
    { name: "任务2", status: "进行中", owner: "李四" },
    { name: "任务3", status: "待开始", owner: "王五" },
];

let tableHTML = '<table style="width: 100%; border-collapse: collapse;"><thead><tr style="background: #667eea; color: white;"><th style="padding: 10px;">任务</th><th style="padding: 10px;">状态</th><th style="padding: 10px;">负责人</th></tr></thead><tbody>';

data.forEach(item => {
    tableHTML += \`<tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px;">\${item.name}</td>
        <td style="padding: 10px;">\${item.status}</td>
        <td style="padding: 10px;">\${item.owner}</td>
    </tr>\`;
});

tableHTML += '</tbody></table>';
previewContent.innerHTML = tableHTML;
console.log("Table rendered with", data.length, "rows");`,
            api: `// 示例: API 调用（模拟）
previewContent.innerHTML = '<p>🔌 API 调用示例</p><p>使用 fetch() 可以调用后端 API：</p><pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto;">fetch('/api/data')\n  .then(response => response.json())\n  .then(data => {\n    console.log(data);\n  });</pre>';
console.log("API example code displayed");`
        };

        function loadTemplate(name) {
            codeEditor.value = templates[name] || '';
            console.log('Template loaded:', name);
        }

        function runCode() {
            // 清空预览和控制台
            previewContent.innerHTML = '';
            consoleOutput.innerHTML = '';

            // 重置 console.log
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            console.log = function(...args) {
                addConsoleLine('info', args.join(' '));
                originalLog.apply(console, args);
            };

            console.error = function(...args) {
                addConsoleLine('error', args.join(' '));
                originalError.apply(console, args);
            };

            console.warn = function(...args) {
                addConsoleLine('warn', args.join(' '));
                originalWarn.apply(console, args);
            };

            // 执行代码
            try {
                const code = codeEditor.value;
                if (!code.trim()) {
                    previewContent.innerHTML = '<p style="color: #888;">请在编辑器中输入代码</p>';
                    return;
                }

                // 暴露 previewContent 到全局
                window.previewContent = previewContent;

                // 执行代码
                const result = new Function(code)();
                addConsoleLine('success', '代码执行完成');
                console.log('Execution result:', result);
            } catch (error) {
                addConsoleLine('error', 'Error: ' + error.message);
                previewContent.innerHTML = '<p style="color: #f85149;">❌ ' + error.message + '</p>';
            } finally {
                // 恢复 console
                console.log = originalLog;
                console.error = originalError;
                console.warn = originalWarn;
            }
        }

        function addConsoleLine(type, message) {
            const line = document.createElement('div');
            line.className = 'console-line ' + type;
            line.textContent = '> ' + message;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        function copyToClipboard() {
            const code = codeEditor.value;
            if (!code.trim()) {
                alert('没有可复制的代码');
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                alert('代码已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            });
        }

        function closeLab() {
            if (confirm('确定关闭实验页面吗？')) {
                window.close();
            }
        }

        // 监听错误
        window.onerror = function(msg, url, line) {
            addConsoleLine('error', `Line ${line}: ${msg}`);
            return true;
        };

        // 初始化
        loadTemplate('alert');
    </script>
</body>
</html>
