<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验页面 - Experiment Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        .lab-header {
            background: #1a1a2e;
            padding: 12px 20px;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lab-title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lab-actions {
            display: flex;
            gap: 10px;
        }

        .lab-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .lab-btn.primary {
            background: #667eea;
            color: #fff;
        }

        .lab-btn.secondary {
            background: #2d2d44;
            color: #fff;
        }

        .lab-btn.close {
            background: #dc2626;
            color: #fff;
        }

        .lab-main {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* 左侧组件菜单 */
        .component-menu {
            width: 200px;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d44;
        }

        .menu-header {
            padding: 12px 16px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #2d2d44;
        }

        .menu-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .menu-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-left-color: #667eea;
        }

        .menu-item-icon {
            font-size: 18px;
        }

        .menu-item-text {
            font-size: 13px;
        }

        /* 实验画布区域 */
        .experiment-canvas {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-header {
            background: #fafbfc;
            padding: 8px 16px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .canvas-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .canvas-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            background: #fff;
            position: relative;
        }

        /* 日志区域 */
        .log-area {
            height: 150px;
            background: #0d1117;
            border-top: 1px solid #2d2d44;
            display: flex;
            flex-direction: column;
        }

        .log-header {
            background: #161b22;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d2d44;
        }

        .log-title {
            color: #888;
            font-size: 12px;
        }

        .log-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #c9d1d9;
        }

        .log-line {
            margin: 4px 0;
            padding: 2px 0;
        }

        .log-line.info { color: #58a6ff; }
        .log-line.success { color: #3fb950; }
        .log-line.warn { color: #d29922; }
        .log-line.error { color: #f85149; }
        .log-line.debug { color: #8b949e; }

        /* 组件样式 */
        .component-wrapper {
            width: 100%;
            height: 100%;
        }

        /* 脑图样式 */
        .mindmap-container {
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        /* 框图样式 */
        .frame-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .frame-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .frame-box {
            background: #fff;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px 25px;
            min-width: 150px;
            text-align: center;
        }

        .frame-box.highlight {
            background: rgba(102, 126, 234, 0.1);
        }

        .frame-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 24px;
        }

        /* 甘特图样式 */
        .gantt-container {
            width: 100%;
            overflow: auto;
        }

        .gantt-table {
            width: 100%;
            border-collapse: collapse;
        }

        .gantt-table th,
        .gantt-table td {
            border: 1px solid #e8e8e8;
            padding: 8px;
            text-align: center;
        }

        .gantt-table th {
            background: #fafbfc;
            font-weight: 600;
        }

        .gantt-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* 流程图样式 */
        .flow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flow-node {
            background: #fff;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 15px 25px;
            min-width: 120px;
            text-align: center;
        }

        .flow-arrow {
            color: #28a745;
            font-size: 24px;
        }

        /* 关系图样式 */
        .relation-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .relation-node {
            position: absolute;
            background: #fff;
            border: 2px solid #ffc107;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="lab-header">
        <div class="lab-title">
            <span>🧪</span>
            实验页面
        </div>
        <div class="lab-actions">
            <button class="lab-btn close" onclick="closeLab()">关闭</button>
        </div>
    </div>

    <div class="lab-main">
        <!-- 左侧组件菜单 -->
        <div class="component-menu">
            <div class="menu-header">选择组件类型</div>
            <div class="menu-item active" data-component="mindmap" onclick="selectComponent('mindmap')">
                <span class="menu-item-icon">🧠</span>
                <span class="menu-item-text">脑图</span>
            </div>
            <div class="menu-item" data-component="frame" onclick="selectComponent('frame')">
                <span class="menu-item-icon">📐</span>
                <span class="menu-item-text">框图</span>
            </div>
            <div class="menu-item" data-component="gantt" onclick="selectComponent('gantt')">
                <span class="menu-item-icon">📅</span>
                <span class="menu-item-text">甘特图</span>
            </div>
            <div class="menu-item" data-component="flow" onclick="selectComponent('flow')">
                <span class="menu-item-icon">🔄</span>
                <span class="menu-item-text">流程图</span>
            </div>
            <div class="menu-item" data-component="relation" onclick="selectComponent('relation')">
                <span class="menu-item-icon">🕸️</span>
                <span class="menu-item-text">关系图</span>
            </div>
            <div class="menu-item" data-component="custom" onclick="selectComponent('custom')">
                <span class="menu-item-icon">✨</span>
                <span class="menu-item-text">自定义</span>
            </div>
        </div>

        <!-- 实验画布 -->
        <div class="experiment-canvas">
            <div class="canvas-header">
                <span class="canvas-title" id="canvasTitle">🧠 脑图实验</span>
            </div>
            <div class="canvas-content" id="canvasContent">
                <!-- 动态渲染组件 -->
            </div>

            <!-- 日志区域 -->
            <div class="log-area">
                <div class="log-header">
                    <span class="log-title">📋 输出日志</span>
                    <button class="lab-btn secondary" onclick="copyLogs()">📋 复制日志</button>
                </div>
                <div class="log-content" id="logContent">
                    <!-- 日志内容 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvasContent = document.getElementById('canvasContent');
        const logContent = document.getElementById('logContent');
        const canvasTitle = document.getElementById('canvasTitle');

        const componentConfigs = {
            mindmap: {
                title: '🧠 脑图实验',
                icon: '🧠'
            },
            frame: {
                title: '📐 框图实验',
                icon: '📐'
            },
            gantt: {
                title: '📅 甘特图实验',
                icon: '📅'
            },
            flow: {
                title: '🔄 流程图实验',
                icon: '🔄'
            },
            relation: {
                title: '🕸️ 关系图实验',
                icon: '🕸️'
            },
            custom: {
                title: '✨ 自定义实验',
                icon: '✨'
            }
        };

        let currentLogs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = {
                time: timestamp,
                message: message,
                type: type
            };
            currentLogs.push(logEntry);

            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(line);
            logContent.scrollTop = logContent.scrollHeight;

            console.log(`[${type.toUpperCase()}]`, message);
        }

        function selectComponent(name) {
            // 更新菜单状态
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-component="${name}"]`).classList.add('active');

            // 更新标题
            const config = componentConfigs[name];
            canvasTitle.textContent = config.title;
            log(`选择组件: ${config.title}`, 'info');

            // 清空画布和日志
            canvasContent.innerHTML = '';
            logContent.innerHTML = '';
            currentLogs = [];

            // 渲染组件
            renderComponent(name);
        }

        function renderComponent(name) {
            log('开始渲染组件...', 'info');

            switch(name) {
                case 'mindmap':
                    renderMindmap();
                    break;
                case 'frame':
                    renderFrame();
                    break;
                case 'gantt':
                    renderGantt();
                    break;
                case 'flow':
                    renderFlow();
                    break;
                case 'relation':
                    renderRelation();
                    break;
                case 'custom':
                    renderCustom();
                    break;
            }

            log('组件渲染完成', 'success');
        }

        function renderMindmap() {
            log('渲染脑图结构...', 'info');

            const html = `
                <div class="mindmap-container">
                    <div style="padding: 20px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                            <div style="background: #1a1a2e; color: #fff; padding: 15px 30px; border-radius: 8px; font-weight: 600;">
                                🎯 项目根节点
                            </div>
                        </div>
                        <div style="display: flex; gap: 40px; justify-content: center; margin-top: 30px;">
                            <div style="text-align: center;">
                                <div style="background: #f6ffed; border: 2px solid #52c41a; padding: 12px 20px; border-radius: 6px; margin-bottom: 10px;">
                                    Phase 1
                                </div>
                                <div style="color: #888; font-size: 12px;">MCP基础设施</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="background: #fff7e6; border: 2px solid #faad14; padding: 12px 20px; border-radius: 6px; margin-bottom: 10px;">
                                    Phase 2
                                </div>
                                <div style="color: #888; font-size: 12px;">Agent智能层</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="background: #fff1f0; border: 2px solid #ff4d4f; padding: 12px 20px; border-radius: 6px; margin-bottom: 10px;">
                                    Phase 3
                                </div>
                                <div style="color: #888; font-size: 12px;">闭环验证</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('脑图结构已显示', 'success');
        }

        function renderFrame() {
            log('渲染框图结构...', 'info');

            const html = `
                <div class="frame-container">
                    <div class="frame-row">
                        <div class="frame-box highlight">
                            <div>📊 数据输入</div>
                        </div>
                        <div class="frame-arrow">→</div>
                        <div class="frame-box">
                            <div>🔄 数据处理</div>
                        </div>
                        <div class="frame-arrow">→</div>
                        <div class="frame-box">
                            <div>📤 数据输出</div>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <div class="frame-box" style="display: inline-block;">
                            <div>💾 数据存储</div>
                        </div>
                    </div>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('框图结构已显示', 'success');
        }

        function renderGantt() {
            log('渲染甘特图结构...', 'info');

            const html = `
                <div class="gantt-container">
                    <table class="gantt-table">
                        <thead>
                            <tr>
                                <th style="width: 150px;">任务</th>
                                <th>2/1</th>
                                <th>2/5</th>
                                <th>2/10</th>
                                <th>2/15</th>
                                <th>2/20</th>
                                <th>2/25</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>📋 MCP协议</td>
                                <td colspan="2">
                                    <div class="gantt-bar">██████</div>
                                </td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>🔧 MCP Server</td>
                                <td></td>
                                <td colspan="3">
                                    <div class="gantt-bar">██████████</div>
                                </td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>🤖 PlanAgent</td>
                                <td></td>
                                <td></td>
                                <td colspan="2">
                                    <div class="gantt-bar">██████</div>
                                </td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>✅ 验收测试</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td colspan="2">
                                    <div class="gantt-bar">██████</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('甘特图结构已显示', 'success');
        }

        function renderFlow() {
            log('渲染流程图结构...', 'info');

            const html = `
                <div class="flow-container">
                    <div class="flow-node">📝 输入</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-node">🔍 分析</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-node">⚙️ 处理</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-node">✅ 验证</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-node">📤 输出</div>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('流程图结构已显示', 'success');
        }

        function renderRelation() {
            log('渲染关系图结构...', 'info');

            const html = `
                <div class="relation-container">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                        <div style="background: #1a1a2e; color: #fff; padding: 20px; border-radius: 50%; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px;">
                            核心节点
                        </div>
                    </div>
                    <div class="relation-node" style="top: 20%; left: 30%;">节点A</div>
                    <div class="relation-node" style="top: 20%; right: 30%;">节点B</div>
                    <div class="relation-node" style="bottom: 20%; left: 20%;">节点C</div>
                    <div class="relation-node" style="bottom: 20%; right: 20%;">节点D</div>
                    <div class="relation-node" style="top: 50%; right: 10%;">节点E</div>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('关系图结构已显示', 'success');
        }

        function renderCustom() {
            log('自定义组件实验区域...', 'info');

            const html = `
                <div style="padding: 40px; text-align: center; color: #888;">
                    <div style="font-size: 48px; margin-bottom: 20px;">✨</div>
                    <h3 style="margin-bottom: 10px;">自定义组件实验区</h3>
                    <p>在这里设计你的自定义组件样式</p>
                    <p style="margin-top: 20px; font-size: 12px;">提示：可在此区域预览任意HTML/CSS/JS组件</p>
                </div>
            `;

            canvasContent.innerHTML = html;
            log('自定义区域已就绪', 'success');
        }

        function copyLogs() {
            const logsText = currentLogs.map(l => `[${l.time}] [${l.type.toUpperCase()}] ${l.message}`).join('\n');
            navigator.clipboard.writeText(logsText).then(() => {
                log('日志已复制到剪贴板', 'success');
                alert('日志已复制到剪贴板！');
            }).catch(err => {
                log('复制失败: ' + err.message, 'error');
            });
        }

        function closeLab() {
            if (confirm('确定关闭实验页面吗？')) {
                window.close();
            }
        }

        // 初始化
        log('实验页面已启动', 'info');
        log('请从左侧选择组件类型进行实验', 'info');
        selectComponent('mindmap');
    </script>
</body>
</html>
