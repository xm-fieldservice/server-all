<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent 问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-section {
            padding: 30px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-group button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
        }

        .result-box .loading {
            color: #666;
            font-style: italic;
        }

        .result-box .success {
            color: #28a745;
        }

        .result-box .error {
            color: #dc3545;
        }

        .process-steps {
            margin-top: 20px;
            display: none;
        }

        .process-steps.show {
            display: block;
        }

        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .step-number {
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .step-text {
            font-size: 14px;
            color: #333;
        }

        .status-bar {
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.online {
            background: #28a745;
        }

        .status-indicator.offline {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Multi-Agent 问答系统</h1>
            <p>Agent A (AutoGen) → Agent B (OpenCode)</p>
        </div>

        <div class="main-card">
            <div class="chat-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="请输入您的指令..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button id="submitBtn" onclick="submitMessage()">发送</button>
                </div>

                <div class="process-steps" id="processSteps">
                    <div class="step">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-label">用户原始输入</div>
                            <div class="step-text" id="step1">-</div>
                        </div>
                    </div>
                    <div class="step">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-label">Agent A 梳理后</div>
                            <div class="step-text" id="step2">-</div>
                        </div>
                    </div>
                    <div class="step">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-label">Agent B 返回结果</div>
                            <div class="step-text" id="step3">-</div>
                        </div>
                    </div>
                </div>

                <div class="result-section">
                    <h3>返回结果</h3>
                    <div class="result-box" id="resultBox">
                        <span class="loading">请输入指令开始对话...</span>
                    </div>
                </div>
            </div>

            <div class="status-bar">
                <div>
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">检查状态...</span>
                </div>
                <div id="lastTime"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkHealth() {
            try {
                const resp = await fetch('/api/health');
                const data = await resp.json();
                const indicator = document.getElementById('statusIndicator');
                const text = document.getElementById('statusText');
                
                if (data.status === 'ok') {
                    indicator.className = 'status-indicator online';
                    text.textContent = '服务正常';
                } else {
                    indicator.className = 'status-indicator offline';
                    text.textContent = '服务异常';
                }
            } catch (e) {
                document.getElementById('statusIndicator').className = 'status-indicator offline';
                document.getElementById('statusText').textContent = '连接失败';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitMessage();
            }
        }

        async function submitMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const stepsDiv = document.getElementById('processSteps');

            const message = input.value.trim();
            if (!message) return;

            // UI 状态：加载中
            btn.disabled = true;
            btn.textContent = '处理中...';
            resultBox.innerHTML = '<span class="loading">正在处理，请稍候...</span>';
            stepsDiv.classList.add('show');

            document.getElementById('step1').textContent = message;
            document.getElementById('step2').textContent = '正在梳理...';
            document.getElementById('step3').textContent = '等待 Agent B 响应...';

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await resp.json();

                if (data.success) {
                    document.getElementById('step2').textContent = data.refined_input;
                    document.getElementById('step3').textContent = data.result.substring(0, 200) + (data.result.length > 200 ? '...' : '');
                    
                    resultBox.innerHTML = `<span class="success">✓ 完成 (${data.duration})</span><br><br>${data.result.replace(/\n/g, '<br>')}`;
                    
                    document.getElementById('lastTime').textContent = data.timestamp;
                } else {
                    resultBox.innerHTML = `<span class="error">✗ 错误: ${data.error}</span>`;
                }

            } catch (e) {
                resultBox.innerHTML = `<span class="error">✗ 网络错误: ${e.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '发送';
            }
        }

        // 页面加载时检查状态
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
